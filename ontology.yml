# The ontology for Local Browser AI: the naming contract. Development only, never copied to
# dist/, never shipped in the Web Store zip (scripts/package.js drops it).
#
# One line per term, under the domain it belongs to. The key IS the id, unique across the
# file. The value reads: `<definition>; code <where it lives>; ui <exact strings>; not <words
# that are wrong for this>` - only the segments that matter are present.
#
# To find a word you have but not the thing: follow the tree, then grep. Every wrong word
# appears in some term's `not`, so `grep -i 'session' ontology.yml` lands on the answer.
#
# Rules: one term per concept; code and UI may differ only where an entry says so with both;
# renaming means changing code, UI, docs and this file in one change; a new concept, control
# or pipeline stage gets a line here in the same change that adds it.

meta:
    version: 17
    updated: 2026-11-13
    status: contract
    shipped: false

# The product and how one request is executed.
harness:
    harness: the extension as a whole; code src/app, src/core, src/state; not agent framework, backend
    conversation: the stored chat; code Conversation, conversationStore; ui Chat, Chats, New chat; not session, thread
    open-chat: the chat the panel was showing, reopened on its next load; code restoreLastConversation, readOpenChatId, writeOpenChatId, ui-state.v1; not last session, restore point
    session: a browser or client lifetime, never a chat; code chrome.storage.session, declarativeNetRequest session rules, MCP session; not chat, thread
    message: one stored transcript item, either role; code ChatMessage, MessageItem; ui N messages; not bubble, entry
    prompt: the text the user submits; code QueuedPrompt, draftStore, submitPrompt; ui Message, Queue prompt; not question, query
    turn: one prompt plus its answer; code startTurn, keepRecentTurns; ui Keep recent turns; not round, iteration, exchange
    run: one execution of the agent, idle to idle; code RunState, runStore; internal, never a UI word; not turn, job, task
    step: one model call plus the tool calls it asked for; code maxToolSteps, stepCountIs, continueRun, countSteps, describeSteps; ui Maximum tool steps per answer, Completed 3 steps in 12.4 s; not round, iteration
    tool-step-limit: the cap that stops a run which keeps asking for tools, and the offer that spends another budget; code stepLimitStore, continueRun, cancelStepLimit, finishReason tool-calls; ui Reached the limit of N tool steps for this answer., Continue, Cancel; not rate limit, throttle, max calls
    answer: the assistant output the user reads; code MessageItem, MessageStatus; ui Copy answer, Generate this answer again; not response, reply, output
    prompt-queue: the per-conversation FIFO filled while a run is busy; code queueStore, drainQueue, QueuedPrompt; ui Queued · N, Queued prompts; not backlog, stack, batch
    queue-pause: the state Stop or a restored chat sets so the queue stays put; code queuePausedStore, resumeQueue, restoreLastConversation; ui Continue, Continue queued prompts; not hold, suspend
    aborted: stopped by the user before it finished; code MessageStatus.aborted, ErrorKind.aborted; ui stopped, Stopped.; not cancelled, interrupted, failed
    omnibox: the address bar, where the lbai keyword starts a prompt; code manifest omnibox keyword, enterOmniboxPrompt, OMNIBOX_SUGGESTION; ui lbai, Ask Local Browser AI about this page; not search bar, url bar, address bar command
    omnibox-prompt: a prompt accepted in the address bar, which opens a new chat on the current page and sends it; code OmniboxPrompt, prompt.pending, prompt.add, startOmniboxChat; ui Ask Local Browser AI about this page; not quick chat, address chat, one-shot prompt

# The assembled prompt and the token accounting around it.
context:
    context: the assembled prompt sent to the model; code ContextPart, buildContext, ContextSnapshot; ui Context, Context settings; not history, page, memory
    context-part: one labelled slice with its own token count; code ContextPart, system, environment, tab, memory, page, summary, history, mcp; ui System prompt, Language, Open tab, Memory; not block, chunk
    context-window: the most tokens one request can hold; code ModelInfo.contextWindow, contextWindowOverride; ui Context window, Context window override; not limit, max tokens, capacity
    usable-window: what is left for input after the output reserve; code TokenBudget.usable, createBudget; ui usable context window; not budget, limit
    output-reserve: the share of the window held back for the answer; code outputReserveRatio; ui Reserve for the answer; not output budget, headroom
    usage: token counts for one message; code Usage, inputTokens, outputTokens; ui N in / M out, input tokens used in the last step; not stats, cost, spend
    stats: run duration, time to first token, tokens per second; code StreamingStats, transcript__stats; ui ttft, tok/s; not usage, meter, metrics
    token-estimate: a local guess before the provider reports real usage; code estimateTokens, formatTokens; ui ~N tokens, about N tokens in total; not count, measurement
    compaction: the process that shrinks old history to fit again; code planCompaction, microCompact, compactNow; ui Compaction, Compact now; not trim, prune, truncate
    summary: the stored prose that replaces the oldest turns; code ConversationSummary, conversation.summary; ui Earlier conversation; not recap, digest, abstract
    compaction-threshold: the share of the window where compaction runs itself; code compactionThreshold; ui Compact at, Compacts at; not limit, cutoff, trigger
    keep-recent-turns: how many newest turns compaction must leave alone; code keepRecentTurns, turnStarts; ui Keep recent turns; not buffer, window
    reasoning-effort: how much hidden reasoning the model may spend; code ThinkingSelection, ThinkingMenu, thinkingForModel, ProviderSettings.modelThinking; ui Reasoning effort, Reasoning, Thinking…, Default; not thinking level, thought level
    draft-token-count: the live estimate of the unsent prompt's cost; code composer__count, estimateTokens; ui N tok; not usage, meter
    open-tab: the line naming the tab the user was looking at when they sent a prompt, frozen onto that turn and replayed verbatim; the title and URL only, never the page's text, and a page the chat already holds is named by its handle so the model reads it instead of asking for it again; it rides the turn rather than the prompt because a tab changes while the conversation does not, and a prefix that moved on every switch would cost the cache; read at Submit, so a queued prompt describes the tab the user was on when they sent it, not the one there when the queue drains; code PromptTab, prompt-tab.ts, renderPromptTab, describeOpenTabHint, normalizePromptTab, refreshActiveTab, ChatMessage.tab, QueuedPrompt.tab; ui Open tab; not current page, active page, context of the tab, tab bar

# Pages the user adds to a chat, from capture to the prompt.
page:
    page: a page added to a chat, captured once and part of the transcript from the first turn that carries it; before that turn it can be taken back, and a search result page is captured but never listed; code PageSnapshot, pagesStore, messageId, isPageReference, PageSource; ui Example Pricing, 1 page; not attachment, document, source, resource
    page-add: capture a tab and append it to the chat on screen; code addPage, addPageBusyStore, page.add, lastPageAddedStore, drainPendingPages, addQueuedPage, pages-menu__add; ui Add to chat, Add page to chat, Adding the page…; not attach, import, upload, capture
    page-access: the box above the composer that asks how a page may be read, before any grant is requested; code PageAccessRequest, describePageAccess, PAGE_ACCESS_LABELS, pageAccessStore, addCurrentPage, allowPageAccess, cancelPageAccess; ui Continue, Cancel, Dismiss the page request, Adding the page this way gives permanent permission to read and change your data on {host}. For a one-off temporary permission, right-click on the page and choose “Add to chat”, or press the extension icon in the Chrome toolbar instead., To read {host} once, right-click the page and choose “Add to chat”, or use the toolbar button. Continue makes it permanent instead.; not permission dialog, consent prompt, chrome popup
    toolbar-action: the extension's toolbar button, which adds the page on screen and opens the panel when it was closed; code chrome.action.onClicked, addFromToolbar, ensureToolbarAddsPage, openPanelOnActionClick; ui Local Browser AI; not toggle, popup button, side panel switch
    page-version: a second capture of a page already in the chat, kept beside the earlier one under its own handle; code addPage, findAttachedPage, capturedAt; ui Captured 2026-11-06 12:40:07 UTC, Add to chat again; not snapshot, copy, duplicate, re-add
    selection-add: quote the selected text into the draft and capture the page it came from; code quoteSelection, addSelection, selection.add; ui Add to chat (the same menu item); not snippet, excerpt, copy, attach
    page-handle: the short id the model names a page by; code handle, p1, PAGE_HANDLE_HINT; not url, index, position
    page-block: 'the frozen prompt text for one page: handle, title, URL, size and outline; code renderPageBlock, PageSnapshot.block, freezePage; ui Page p1; not summary, digest, preview, index'
    page-ref: the part that marks where a page joined a turn; code PageRefPart, page-ref, messageId; not attachment-ref, marker
    page-list: "the chat's pages, as the first menu of the composer's menu bar: the bar states the count whether the menu is open or closed, and the menu holds one flat row per page under a search box and a + that adds the page on screen; a row carries its capture stamp after the title and is dimmed with a trash can until a turn carries it; code PagesMenu, pages-menu__trigger, menu-item__count, pages-menu__add, pages-menu__list, pages-menu__item, pages-menu__remove, page-chip, page-chip__stamp; ui Pages, Pages in this chat, Search pages, No pages in this chat., No pages match., Add page, Add page to chat, Removing from this chat, Remove from this chat; not attachment bar, tab bar, sidebar, card, page band"
    page-stamp: 'when a page was captured, after its title in the list: the clock time to the second always, and the calendar date only once the capture is on another day (the year too when it differs); never relative, so an open list cannot go stale, and the full instant is the tooltip; code capturedAt, stampTime, stampIso, stampTooltip, page-chip__stamp, time dateTime; ui 01:08:25 PM, Nov 8, 01:08:25 PM, Oct 7, 2025, 01:08:25 PM, Wednesday, November 11, 2026 at 1:08:25 PM UTC; not timestamp, added at, date column, 2 minutes ago'
    page-remove: take a page back out of the chat while no turn carries it; code removePage, pages-menu__remove, Trash2, deletePages; ui Remove from this chat; not delete, dismiss, detach, forget
    pages-count: the number in the Pages menu item, on the bar whether the menu is open or closed, pulsing only while a page is being captured and converted; code pages-menu__trigger, menu-item__count, menu-item__count--busy, lastPageAddedStore, aria-expanded, aria-controls; ui 0, 1, 2; not badge, expander, notification, page icon
    page-card: the card inside a turn showing where a page was added; code PageCard, page-card, page-card__link; ui Open {title} — {url}; not attachment card, file card
    page-focus: bring an added page back on screen, reopening it if its tab is gone; code focusPage, page.focus; ui Open {title}; not jump, switch tab
    tab: a browser tab, the source a page is captured from; code TabInfo, tabIdHint, tab.extract; not page, window
    tab-group: the group holding the tabs one chat's tools opened, so the tabs the extension opened are apart from the ones the user opened; Chrome groups in a second call, so it is done after the fact, one group per chat and window, and the id is remembered only for the browser session because that is how long it means anything; a group the user closed is gone and the next tab starts a new one; code groupConversationTab, TabGroupRecord, TAB_GROUPS_KEY, createSessionStore, chrome.tabs.group, FocusPageResult.opened; not window group, ephemeral tabs, transient window
    extraction: the in-page step that reads a tab; code inject.ts, pipeline.ts, InjectResult; not scraping, parsing, crawling
    representation: which form of the page is used, article or app or text; code PageRepresentation; ui app view; not format, mode, variant
    accessibility-skeleton: a role/name/state rendering for control-heavy shells; code inject.ts, representation app; not ARIA tree, DOM dump, snapshot
    outline: the page's headings with levels and sizes; code OutlineEntry, renderPageBlock; ui N headings; not TOC, table of contents, index
    section: one heading-anchored slice the page tool can read; code PageChunk, splitIntoSections, readSection; ui Reading page; not chunk, block, part
    page-tools: the built-in tool that reads an added page on demand; code read_page, PAGE_TOOL_IDS, ToolContext.getPages; ui Read page, Reading page; not extractors
    read-mode: which detail a page read returns; code read_page mode, outline, section, all, find; ui Outline, Section, Whole page, Find; not level, depth, format

# Durable notes that can enter the context.
memory:
    memory: flat global notes that survive across chats; code settings.memory, memory.ts, memoryStore, memory.v1; ui Memory, Memories, Enable memory; not notes, knowledge base, profile
    memory-item: one stored memory with title, text, mode and source; code MemoryItem, MemoryDocument, MemoryExport; ui Title, Add memory, Edit memory; not note, fact, record
    memory-source: the chat and message a memory was saved from; code MemorySource, source.conversationId; ui from chat; not origin, provenance
    memory-mode: whether a memory is always, auto or tool only; code MemoryMode, selectMemoryInjection; ui Always, Auto, Tool only; not pin, pinned, trigger
    memory-injection: picking memories for a turn and saying what was left out; code selectMemoryInjection, describeMemoryInjection; ui Memory is not in the prompt.; not memory block, memory prompt
    memory-budget: the largest share the injected memory block may occupy; code injectShare; ui Memory budget; not memory share, memory limit
    auto-memories-per-message: how many matching auto memories go in one turn; code autoLimit; ui Auto memories per message; not auto cap
    remember-tool: the built-in tool that creates a memory or updates one; code remember, MemorySaveResult; ui Save to memory, Saved to memory; not memorize, memory writer
    recall-tool: the built-in tool that searches memories on demand; code recall, recallMemories, RecalledMemory; ui Search memory, Searching memory; not lookup, memory reader
    tombstone: a deleted memory kept briefly so sync and undo work; code deletedAt, purgeTombstones, restoreMemory; ui Deleted “{title}”., Undo; not soft delete, trash, recycle bin

# Providers, the models behind them, and the effort knobs.
models:
    provider: one configured way to reach models; code ProviderSettings, settings.providers, getProvider; ui Model Providers, Configured providers, Add a provider; not endpoint, server, adapter
    local-server: a model server the user runs, reached over the OpenAI-compatible API; code baseURL, DEFAULT_BASE_URL; ui Local server, Base URL; not server, host, backend
    base-url: the address a provider's HTTP API sits at; code ProviderSettings.baseURL, normalizeBaseURL; ui Base URL; not endpoint URL, host
    api-key: the credential a model server asks for, never synced; code ProviderSettings.apiKey, headers; ui API key; not token, secret, password
    host-access: the user grant that lets the extension call another origin; code chrome.permissions.request, requestHostAccess, addHostAccessRequest, hasHostAccess, pageAccessStore, optional_host_permissions; ui Check site access, Grant host access, Continue, Allow; not permission, popup
    plain-http: a base URL reached over unencrypted http to a host off this machine, where every device in between can read the prompt and any page attached to it; loopback is exempt because its traffic never leaves the machine; named once per provider, never per model, because every model of that provider is reached the same way; code insecureEndpoint, isLoopbackHost, endpoint.ts, url-warning, popover__group-warning; ui Unencrypted connection, Requests travel over plain HTTP, Unencrypted traffic exposes your prompt and attached pages. Only use over VPN or trusted networks.; not insecure endpoint, unsafe provider, mixed content
    tool-tab: the tab a tool opened, and the wait until the user decides what happens to it; code attachToolTab, ToolContext.attachTab, accessWaiters, TabAttachment, toolTabsStore, waitForTabLoad; ui The search results are on {host}. Continue makes it readable permanently, so later searches need no prompt; or allow it in the address bar., Add page to chat; not approval, confirmation, attachment
    search-tab: the one results tab a search reuses instead of opening another, per chat, so one chat cannot navigate another's results out of its group; code planSearch, rememberedSearchTab, SEARCH_TABS_KEY, readSearchTab; ui Searching the web; not results window, new tab each time
    model: one model id reachable through a provider; code ModelRef, modelId, ModelInfo, getModelInfo; ui Model, Models, Change model, Search models; not engine, llm
    model-reference: the provider/model pair a chat or the default uses; code ModelRef, providerId, Conversation.model, settings.defaultModel; not model selection, model choice
    model-catalog: the static facts about known model ids; code catalog.ts, PROVIDER_DEFAULTS, getModelInfo; ui context N, max out N, tools, reasoning; not catalog, registry
    model-details: what a provider's /models endpoint reported about one of its models; code ModelDetails, discoverModels, parseModelEntry, ProviderSettings.modelDetails, modelDetailsFor, modelContextWindow; ui Model, Type, Modalities, Context, Max output; not metadata, properties, model info
    model-type: what kind of model an id names; code ModelType, classifyModel, chat, embedding, speech, image, classifier, rerank; ui Chat, Embedding, Speech, Image, Classifier, Rerank; not category, kind
    modality: the content a model accepts or produces; code ModelModality, inputModalities, outputModalities, ModalityIcon, MODALITY_ICONS; ui text, image, audio, video; not content type, media type
    model-table: the table of models inside the provider editor; code ProviderModelTable, models-table, models__add, models-table__default; ui Use, Refresh, Add model, Loaded in the server, ~32k, Make default, Default model; not model list, model textarea
    default-model: the model reference new chats start with, set by the star in the provider table and by the same star in the model picker; code settings.defaultModel, resolveDefaultModel, popover__item-star, popover__item-star--on; ui default, Make default, Default model; not fallback model, primary model

# Capabilities the model may call, local and remote.
tools:
    tool: a capability the model may call; code ToolSet, buildTools, buildMcpTools, enabledBuiltInTools; ui Tools, Tools the model may use; not function, command, plugin, action
    built-in-tool: a tool implemented inside the extension; code TOOL_DEFINITIONS, ACTION_TOOL_IDS, tools.ts, BUILT_IN_TOOL_IDS; ui Built-in tools, Built-in; not browser tool, local tool, native tool
    tool-set: one switchable group of tools, the built-in tools or one MCP server; code BuiltInToolsCard, McpServerCard, ToolRow, tool-selection.ts; ui Built-in tools, Auto-approve, No MCP servers yet., Off, Not checked, Not checked yet., Not checked yet. Refresh to list the tools this server offers., Checking…, Unreachable, No tools., This server offers no tools., The tools are unknown while the server cannot be reached., {n} of {n} tools enabled; not tool group, category, plugin
    tool-call: one invocation by the model, with input, output and state; code ToolCallPart, ToolCallState, running, complete, error; ui waiting, running, done, failed, denied; not invocation, tool use
    tool-output: what a tool returns, clipped and treated as untrusted; code MAX_TOOL_CHARS, clipToolText, tool-text.ts; ui Output, Error, truncated; not payload, body, result payload
    approval: the inline question before an action tool runs; code requestApproval, resolveApproval, approvalsStore; ui Allow this action?, Allow, Deny; not confirmation, permission, consent
    auto-approve: the control that lets a tool or a whole tool set skip that question; code autoApprove, autoApproveTools, TOOLS_ADDED_IN, setMcpToolAutoApprove; ui Auto-approve, Run without asking, Run {tool} without asking, Run {server} tools without asking; not always allow, trust, whitelist, autorun
    mcp: Model Context Protocol, HTTP servers whose tools join the built-ins; code @ai-sdk/mcp, mcp.ts, net-rules.ts; ui MCP, MCP servers; not connector, plugin system, integration
    mcp-server: one configured Streamable HTTP endpoint, shown as one tool set; code McpServerSettings, McpServerCard, tools.mcp, mcpServerKey; ui MCP servers, Add MCP server, URL, Headers, Refresh, Edit, Remove; not remote server, tool server, endpoint
    mcp-server-editor: the form that adds or edits one server in place of its row; code McpServerEditor, mcp-editor; ui Add an MCP server, Edit {server}, Add server, Save server, Test connection, Cancel; not panel, dialog, modal
    mcp-header: one Name/Value pair sent with every request to that server; code HeaderRow, headersToRows, rowsToHeaders, mcp-header; ui Headers, Name, Value, Add header, Remove header; not attribute, parameter, key-value
    mcp-tool: a tool discovered from that server, offered under a namespaced name; code McpDiscoveredTool, buildMcpTools; ui MCP · {server}; not remote tool, server tool, external tool
    mcp-catalog: the cached probe result of what each server offers; code McpCatalogEntry, McpCatalogStatus, mcpCatalogStore; ui Not checked, Checking…, Unreachable, {n} tools; not tool list, cache
    tool-namespace: the model-facing MCP tool name, mcp_server_tool; code mcpToolName, assignToolNames, toolKey; not prefix, qualified name, alias
    strip-origin: a per-server option that removes the Origin header; code stripOrigin, net-rules.ts; ui Send requests without an Origin header; not CORS bypass, header hack

# Prompt templates the user inserts.
prompt-templates:
    prompt-template: a saved prompt inserted by menu or slash; code PromptTemplate, settings.promptTemplates, promptTemplateStore; ui Templates, Prompt templates, Insert a prompt, Add template, Manage templates; not skill, slash command, macro, recipe
    built-in-prompt-template: a template shipped with the extension, editable and resettable; code builtInPromptTemplates, summarize-page, critique, compare; ui built-in, Reset; not default template, built-in skill

# Coding-agent packages in the repo, unrelated to the product's prompt templates.
agent-skills:
    agent-skill: a coding-agent package under .agents/skills, vendored and hash-locked or written here; code .agents/skills, skills-lock.json, slm-harness; not prompt template, product template

# Every side-panel element, grouped by where it sits in the panel.
ui:
    panel:
        side-panel: the Chrome side panel where chatting happens; code side-panel.html, src/app, App.tsx; ui Local Browser AI; not popup, sidebar, chat window
        header: the top bar with the chat title and three buttons; code Header, header__title; ui New chat, Chat history, Settings; not topbar, toolbar, app bar
        banner: a full-width message above the transcript; code banner, banner--error, banner--warn; ui No model is configured yet., Set up a model, Retry, Dismiss; not toast, alert, notification
        transcript: the scrolling message list; code Transcript, transcript, transcript__spacer; not chat log, message list, feed, thread
        empty-state: the first-run screen before any message; code EmptyState, empty__title; ui What are you reading?, Download model; not welcome screen, onboarding, splash
        chats-drawer: the overlay listing saved chats; code HistoryPanel, drawer, drawer__panel, history; ui Chats, Chat history, Delete chat, No saved chats yet.; not history panel, sidebar, menu
    composer:
        composer: the whole input area at the bottom, spending the panel's full width with no gutter, border or radius; code Composer, composer, composer--sized, composer--resizing; ui Message; not prompt box, input bar, message box
        composer-box: the prompt band, flush under the menu bar and a shade darker than the panel, holding only the textarea and its 1px accent focus ring; code composer__box, composer__box::after, focusPrompt, composer__input:focus, bg-sunken; not input box, border
        composer-band: the stack of the menu bar and the prompt band, which the resize line measures against so a row that arrives above the prompt costs the transcript rather than the prompt; code composer__editor, composer__editor--streaming; not frame, wrapper, outline, surface
        composer-input: the auto-growing textarea; code composer__input, composer-input; ui Ask anything, or type / for a template, Queue another message…; not text field, editor
        composer-menubar: the flat row of menu words above the prompt, in the order a window menu puts them, each item filling the bar's height, wrapping rather than clipping when the panel or the text size leaves it no room; one menu is open at a time, a click toggles it and a hover hands it to the item under the pointer once one is open; code composer__menubar, openMenuStore, useBarMenu, openMenu, toggleMenu, hoverMenu, closeMenu; ui Pages, Templates, Tools, Model, Thinking; not toolbar, button row, footer, action bar
        composer-meta: the row under the prompt with the meter, the draft count and the actions at its trailing edge; code composer__meta, composer__count, composer__submit; ui Enter to submit, ⌘↵ to submit; not status bar, footer
        queue-row: one queued prompt above the menu bar; code composer__queue-item, composer__queue-text; ui Queued · N, Remove from queue and edit; not pending item, queued message
        menu-items:
            menu-item: one flat word on the menu bar, with an optional count pill and an optional value the menu holds; its highlight is square and on the panel's own surface while its menu is open, because it is the top of that menu rather than a button above it; code MenuButton, menu-item, menu-item__label, menu-item__count, menu-item__value, onHover, aria-expanded; not chip, pill, tag, badge, button
            pages-menu-item: the first item, naming the menu that lists this chat's pages; code PagesMenu, pages-menu__trigger, Plus; ui Pages, Add page to chat; not page button, attachments menu
            prompt-templates-menu-item: the item that opens the template list; code PromptTemplateMenu, templates-menu__trigger; ui Templates, Prompt templates, Insert a prompt, Search templates, No templates match., Manage templates; not skill button, skill menu
            tools-menu-item: the item opening the tree of tool sets, carrying the number of tools the model could call; code ToolsMenu, tools-menu__trigger, ToolTree, countEnabledTools; ui Tools, Built-in, No MCP servers yet., Manage tools; not tool button, plugin menu
            model-menu-item: the item naming the model in use; code ModelPicker, model-menu__trigger; ui Model, Choose model, Change model, Search models; not model selector, model dropdown, model chip
            reasoning-menu-item: the item naming the reasoning effort, shown only for a model that reasons; code ThinkingMenu, thinking-menu__trigger, thinkingOptions; ui Thinking, Reasoning effort, Reasoning, Off, Auto, High; not thinking chip
        menus:
            popover: the anchored panel an item opens, above the bar and over the transcript; a menu's panel is flush on its item's own edge with no gap between them, square where the two meet and rounded only on its far corners, so the two read as one surface, and it hangs from its item's left edge with only the overflow past the side panel moved back; code Popover, popover, popover--flush, popover__header, popover__group, popover__item, popover--end; not dropdown, modal, dialog, floating box
            model-picker: the popover listing models by provider, with search and each model's facts; code ModelPicker, popover__header, popover__model, popover__model--selected, popover__item--model, popover__item-row, popover__item-token, popover__item-facts, popover__item-loaded, popover__item-star, ModalityIcon; ui Search models, No models. Add a provider in Settings., Manage model providers, Reasoning, Context, Max output, Loaded in the server, Make default, Default model; not model menu, provider picker, model table
            slash-menu: the inline prompt-template list that appears after a slash; code slashQuery, slash, slash__item; not command palette, autocomplete
        actions:
            submit: the primary button that sends or queues the prompt; code composer__submit, ArrowUp, submitPrompt, ui.submitKey; ui Submit, Queue prompt; not send, go, ask, run
            stop: the button that aborts the run and parks the queue; code stopGeneration, activeController, Square; ui Stop generating; not cancel, abort, halt
            continue: the button that clears a queue pause and drains; code resumeQueue, Play; ui Continue, Continue queued prompts; not resume, play, restart
            resize: the line above the composer that sets its height by dragging, and grows the composer upward when a row appears above the prompt so the prompt keeps its height; code composer__resizer, composer--sized, composer--resizing, composerHeightFromDrag, composerLimits, clampComposerHeight, composerHeightForChrome; ui Resize prompt, Drag to resize · double-click to reset; not expander, splitter, grip, handle, maximize, fullscreen
            retry: regenerate the last answer; code regenerate, retried; ui Retry, Generate this answer again; not rerun, try again
    message:
        message-bubble: the container of a user message; code message__bubble, message__text, message__actions; not user bubble
        prompt-template-badge: the marker showing which template filled a message; code message__template, BookMarked; not chip, tag, skill badge
        message-actions: the hover row with save, copy and retry; code message__footer, SaveMemoryButton; ui Save to memory, Copy answer, Retry; not toolbar, message controls
        typing-indicator: the three dots shown while the answer has no text yet, including the wait after tool results; code typing, waiting, answered; ui The model is responding, Waiting for the model to read the tool results; not spinner, loader, thinking dots
        aborted-badge: the marker on a stopped message; code badge, MessageStatus.aborted; ui stopped; not cancelled badge
        reasoning-block: the collapsible row holding the model's reasoning inside the steps group; code ReasoningBlock, reasoning__toggle, reasoning__body; ui Thinking…, Thought process, ~N tokens; not thinking block, chain of thought
        tool-card: the step row for one tool call, with icon, activity, argument, state badge and detail; code ToolCallCard, tool__head, tool__body, tool__approval, data-state; ui Allow this action?, Allow, Deny, Input, Output; not tool bubble, tool message
        step-group: the reasoning and tool calls of one answer as a single flow, folded into one line once the run ends; code StepsGroup, steps, steps__summary, steps__list, steps__item, isStepPart, countSteps, describeSteps, ChatMessage.steps, ChatMessage.durationMs; ui Completed 3 steps in 12.4 s · ~1.2k tokens; not run summary, activity log, trace, timeline
    numbers:
        context-meter: the bar and popover showing what fills the window; code ContextMeter, meter__bar, meter__threshold; ui What is using the context window, Compact now, Context settings; not stats, usage bar, token counter
    atoms:
        badge: a small label showing a count or state, never clickable; code badge, badge--accent, badge--danger; ui always, auto, tool only, built-in, actions, changed; not chip, pill, tag, button
        settings-button: the icon-only gear in a menu that closes it and opens Settings at its section; code SettingsButton, openSettings, settingsSectionHash; ui Manage templates, Manage tools, Manage model providers; not cog, settings link, configure icon

# The full-page configuration surface. Called Settings in code, UI and docs alike.
settings:
    settings: the full-page surface opened from the header or a menu gear, optionally at a section; one tab, focused when already open; code src/settings, settings.html, SettingsApp, openSettings; ui Settings, Settings sections; not options, config, preferences
    settings-section: one page of it, chosen from the rail; code SettingsSectionId, SETTINGS_SECTIONS, SECTION_ALIASES, settings__nav-item; ui General, Appearance, Model Providers, Templates, Tools, Memory, Context; not tab, panel
    settings-route: the fragment that names the open section, General the bare page; code parseSettingsHash, settingsSectionHash, settings.html#templates, SECTION_ALIASES; ui hash, settings.html#templates, #prompt-templates, #skills; not query string, path, tab
    settings-card: a titled group of related controls; code SettingsCard, group__title, group__head, group__actions, card, rows, field; ui Appearance, Rendering, System prompt, Tool Calls, Data, About, Compaction; not box, panel, widget
    settings-field: one labelled control row inside a card; code field__label, field__hint; ui Theme, Submit with, Font size, Math; not option, item, input
    switch: the on/off control for booleans; code Switch, SwitchField, role=switch; ui Auto-approve, Run without asking, Enable memory, Send requests without an Origin header, Use {model id}; not toggle, checkbox, slider
    checkbox: the availability control, full, empty or dashed when a tool set is partly on; code Checkbox, checkbox, indeterminate, SelectionState; ui Enable {tool}, Enable {server}, Enable every built-in tool, Run every built-in tool without asking, Run {server} tools without asking; not toggle, tickbox
    tool-tree: the expandable tree of tool sets in the composer's Tools menu; code ToolTree, tool-tree__group, tool-tree__toggle, tool-tree__row, mcpServerSelection; ui Tools, Built-in, Expand, Collapse, Manage tools; not accordion, dropdown list, submenu
    settings-version: the schema version that migrates fields and tools once; code SETTINGS_VERSION, migrateSettings, TOOLS_ADDED_IN; not schema version, config version
    platform-settings: this extension's own entry in Chrome's Extensions page, opened from the rail under the divider; keyboard shortcuts, allow-in-incognito and the update controls live there and no extension can reproduce them; code openPlatformSettings, platformSettingsUrl, settings__nav-action; ui Platform Settings…, Available in the installed extension.; not extension settings, browser settings, options page
    extension-site-settings: this extension's own entry in Chrome's site settings, opened from the rail beside Platform Settings…; the permissions for its origin — notifications, camera, pop-ups — live there; code openExtensionSiteDetails, extensionSiteDetailsUrl, settings__nav-action; ui Privacy and security…, Available in the installed extension.; not permissions page, site access page, browser settings
    rail-link: a rail row that leaves Settings for one of Chrome's own pages instead of opening a section, carrying its own leading icon and a trailing external-link glyph; code railLinks, RailLink, RAIL_LINK_UNAVAILABLE, settings__nav-icon--trailing, settings__divider; ui Platform Settings…, Privacy and security…, Available in the installed extension.; not footer link, section, hash route

# Failures, from a provider error down to a single warning.
errors:
    app-error: the normalised error shape with a machine-readable kind; code AppError, toAppError, isRetryableKind; not exception, fault, failure
    error-kind: the closed set that says what went wrong; code ErrorKind, aborted, auth, context-overflow, permission, unsupported; not error code, error type
    error-part: an error rendered inside an assistant message; code ErrorPart, message__error; ui This may be temporary.; not message error, inline alert
    run-error: the banner for a failed run, with Retry; code RunState.error, clearRunError, banner--error; ui Retry, Dismiss; not error toast, error dialog
    mcp-warning: a dismissible warning that one MCP server is down; code McpWarning, mcpWarningsStore, banner--warn; ui Dismiss; not error, failure
    inline-error: the error line above the composer box; code addPageErrorStore, composer__error; not toast, banner, error banner

# Known divergences, keyed by the term they belong to. Two markers:
#   pending  - a change is owed; fix it and delete the line.
#   decision - a deliberate exception that is part of the contract. Do NOT "fix" one into a
#              regression; delete the line only if the decision itself is reversed.
# An empty list is the goal for `pending`, not for `decision`.
drift:
    mcp-server: Built-in tools and MCP servers are one thing to the user — one Tools section and one composer tree, where the built-in set is the first tool set. decision
    tool-card: the row is a flat step now, not a card; the id and `ToolCallCard` keep the name. decision
    conversation: code says Conversation, UI says Chat, and the drawer component is HistoryPanel; the dual register is approved, the component name is not. decision
    reasoning-effort: code says thinking, UI says Reasoning effort, Thinking… is only a live status; the split is approved. decision
    tool-card: Settings names the capability, the transcript names the activity; deliberate, do not copy one into the other. decision
    page: '`attachment` is retired everywhere except the UI word Attachment; the model-facing noun is page. decision'
    composer: "the composer spends the panel's full width with no border, radius or gutter: the menu bar sits flush against the resize line and the prompt band is a darker surface whose only edge is the accent ring, drawn while the prompt itself has focus. No menu item or action button is inside that band — the actions moved to the row under it — so the ring can only ever mean `a keystroke lands here`. The pages live in the first menu rather than in a band above the prompt, because a chat with five pages would otherwise spend five rows of the panel on them; the count stays on the bar, and an add opens the menu itself. decision"
    page-list: 'the page rows use `.page-chip` (a page reference wherever it is drawn) rather than a `.menu-item`, because one of them is a row and the other a word on the bar. decision'
    toolbar: 'the toolbar button adds the page on screen (`action.onClicked`), so `openPanelOnActionClick` is reset to `false` on every worker start; it opens the panel only when it was closed, and never closes it. This reverses the v2/v3 toggle rule, which had to set the flag instead. decision'
